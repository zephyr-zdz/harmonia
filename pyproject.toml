[project]
name = "harmonia"
version = "0.1.0"
description = "Local harmonic analysis for pop music (J-pop / City Pop): chords, local keys, roman numerals, notable harmonic events with confidence."
requires-python = ">=3.11"
# Phase 1 (symbolic analysis) is stdlib-only. Audio / evaluation dependencies are added
# only after explicit approval (see CLAUDE.md, "Dependencies").
dependencies = []

[project.scripts]
harmonia = "harmonia.cli:main"

[project.optional-dependencies]
eval = [
    "mir-eval>=0.8",
]
audio = [
    "audioop-lts>=0.2.2 ; python_full_version >= '3.13'",
    "beat-this>=1.1",
    "demucs>=4.1",
    "librosa>=0.10",
    "lv-chordia",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Supported platforms: Apple Silicon (dev / inference) and Linux (optional GPU training box).
# Intel macOS is excluded: demucs pins numpy<2 there, incompatible with lv-chordia.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
lv-chordia = { git = "https://github.com/openmirlab/lv-chordia.git" }
