# Harmonia analysis-layer configuration (defaults).
#
# Every number here is a hand-set prior derived from music-theory reasoning, NOT fitted to
# any song. If these are ever tuned, tune them ONLY on data/eval/dev and record the change
# (with before/after dev scores) in CLAUDE.md. Never tune on data/eval/test.
#
# Override any value with `harmonia analyze --config my.toml` (deep-merged over this file).

[general]
min_event_confidence = 0.35      # events below this are dropped entirely
low_confidence_threshold = 0.6   # events / segments below this are kept but flagged low_confidence
min_root_prob = 0.05             # root hypotheses with less probability mass are ignored by rules
key_confidence_exponent = 0.5    # key-dependent events are multiplied by key_prob ** this
passing_beats = 0.5              # chord runs shorter than this are skipped as passing / noise
skip_no_chord_beats = 1.0        # "N" runs shorter than this do not block resolution lookups
bass_head_weight = 0.5           # bass evidence = mix of chord candidates' bass and the recogniser's bass head
default_seconds_per_beat = 0.5   # used only to weight inputs with no beat info (assumes 120 BPM)

[key]
# Chord-level HMM over 24 keys. Emission table lives in harmonia/analysis/key_model.py.
switch_penalty = 6.0             # log-cost of changing key between two chords
minor_bias = -0.1                # per-weight-unit prior against minor (pop corpora are mostly major;
                                 # Japanese analysis labels relative-ambiguous loops in major)  [ASK]
minor_leading_tone_bonus = 0.0   # minor keys: extra evidence per V / V7 / vii°(7) (raised 7th). User 2026-10-07;
                                 # value chosen on dev (docs/results.md)
cadence_bonus = 1.0              # V7 -> I (or V7 -> i) supports that key
cadence_triad_factor = 0.3       # plain V triad -> I gets this fraction (it is also I -> IV of the key a 5th
                                 # below). 1.0 -> 0.3 chosen on ChoCo dev 2026-10-06 (see CLAUDE.md)
boundary_tonic_bonus = 3.0       # bonus for the tonic triad at the first / last chord. ON (user 2026-10-07).
                                 # Chords inside / restarting a named progression are exempt (王道 opens on
                                 # IV, 丸サ loops back to IVmaj7). 3.0 from ChoCo dev sweep 0–10 (docs/results.md)
boundary_positions = "both"      # both | last | first
seventh_off_scale_penalty = 0.6  # maj7 / m7 / 6 whose added tone is outside the key
min_region_beats = 16            # key regions shorter than this are merged (tonicization, not modulation)
beats_per_weight_unit = 4.0      # a chord lasting one 4/4 bar gets weight 1
weight_min = 0.25
weight_max = 2.0
ambiguity_ratio = 0.75           # a segment is ambiguous if p(2nd key) >= this * p(1st); global flag if >50% of beats are

[quality]
# Generic quality factor: f = base + (1 - base) * P(match) - contradict_penalty * P(contradict).
# "Uninformative" quality (power chord, sus, unknown) leaves f = base, so quality is a bonus.
# A quality that *contradicts* the function (e.g. a minor chord as "V") is penalised, because
# root motion alone cannot tell ii-V-I from diatonic fifth chains such as vi-ii-V.
base = 0.75
contradict_penalty = 0.5

[ii_V_I]
enabled = true
target_tonic = 1.0               # resolves to the local tonic
target_diatonic = 0.9            # tonicises another diatonic chord (secondary ii-V)
target_other = 0.8               # tonicises a non-diatonic chord (e.g. ii-V to bVI)
sus_v_match = 0.8                # V7sus4 counts as a partial quality match for V
report_unresolved = true         # also report ii–V without its I (type "ii_V")
unresolved_deceptive = 0.75      # ii–V → chord a step above the target (ii–V–vi)
unresolved_other = 0.6           # ii–V → anything else, or end of input
# Unresolved ii–V of a NON-tonic target (2026-10-07, user: too many false applied chords):
# root motion without resolution is weak, so require chromatic V + minor-family ii.
unresolved_min_chromatic = 0.5   # P(V chord has a tone outside the key | its root)
unresolved_min_ii_quality = 0.5  # P(ii is m / ø / ° | its root)

[secondary_dominant]
enabled = true
# Weight of each chord type as dominant evidence. Only counted when the chord contains a tone
# outside the key (its major 3rd or minor 7th): a diatonic C -> F in C major is I -> IV, not V/IV.
weight_dom7 = 1.0
weight_major_triad = 0.85
weight_maj6 = 0.5
weight_aug = 0.6
weight_7sus4 = 0.6
resolved = 1.0                   # next root a 5th below
deceptive = 0.75                 # V/x -> chord a step above x's root (e.g. E7 -> F in C: III7 -> IV)
unresolved = 0.5
unresolved_nondiatonic = false   # report unresolved V/x whose target x is not diatonic (V/♭VII ...)

[secondary_leading_tone]
enabled = true
weight_dim7 = 1.0
weight_dim = 0.9
weight_hdim7 = 0.8

[tritone_sub]
enabled = true
# subV7 shares the tritone (3rd + b7) of V7; without the b7 a bII major triad is better read as
# a borrowed Neapolitan / Phrygian bII, hence the low triad weight (below min_event_confidence).
weight_dom7 = 1.0
weight_major_triad = 0.3
weight_7sus4 = 0.5
target_tonic = 1.0
target_diatonic = 0.9
target_other = 0.75

[aeolian_cadence]
enabled = true
include_minor_keys = false       # in minor, bVI-bVII-i is diatonic; flagging it everywhere is noise

[modulation]
enabled = true
context_segments = 4             # segments on each side used for the modulation confidence

[borrowed]
enabled = true
quality_base = 0.6               # root-chromatic entries: factor when quality is uninformative

# Borrowed (modal-interchange) chords.
#   degree           : chord root in semitones above the tonic
#   qclasses         : coarse quality classes that match (maj, min, dom, dim, hdim, ...)
#   quality_required : true  -> root is diatonic, the borrowed tone is the 3rd/5th/7th, so the
#                               quality IS the evidence (Fm vs F in C major).
#                      false -> root itself is chromatic (Ab in C major); root is the main
#                               evidence, quality only adds confidence (design principle 2).
#   A chord only counts if at least one of its core tones is outside the key.

# ---- major keys (borrowing mainly from the parallel minor) ----
[[borrowed.major]]
degree = 5
qclasses = ["min"]
numeral = "iv"
source = "parallel minor (Aeolian)"
quality_required = true
note = "iv / ivm7 / ivm6: the b6 scale degree (Ab in C) is the borrowed tone."

[[borrowed.major]]
degree = 8
qclasses = ["maj"]
numeral = "♭VI"
source = "parallel minor (Aeolian)"
quality_required = false
note = "bVI / bVImaj7."

[[borrowed.major]]
degree = 10
qclasses = ["maj"]
numeral = "♭VII"
source = "parallel minor (Aeolian) / Mixolydian"
quality_required = false
note = "bVII."

[[borrowed.major]]
degree = 10
qclasses = ["dom"]
numeral = "♭VII7"
source = "parallel minor (Aeolian) / Mixolydian"
quality_required = false
note = "bVII7; resolving to I it is the 'backdoor' dominant."

[[borrowed.major]]
degree = 3
qclasses = ["maj"]
numeral = "♭III"
source = "parallel minor (Aeolian)"
quality_required = false
note = "bIII / bIIImaj7."

[[borrowed.major]]
degree = 2
qclasses = ["hdim", "dim"]
numeral = "iiø7"
source = "parallel minor (Aeolian)"
quality_required = true
note = "ii° / iiø7: the b6 (Ab in C) is the borrowed tone."

[[borrowed.major]]
degree = 7
qclasses = ["min"]
numeral = "v"
source = "Mixolydian / parallel minor"
quality_required = true
note = "v / vm7: the b7 (Bb in C) is the borrowed tone."

[[borrowed.major]]
degree = 0
qclasses = ["min"]
numeral = "i"
source = "parallel minor"
quality_required = true
note = "i / im7 in a major key."

[[borrowed.major]]
degree = 1
qclasses = ["maj"]
numeral = "♭II"
source = "Phrygian (Neapolitan)"
quality_required = false
note = "bII / bIImaj7 without b7. With a b7 and resolving down a semitone it is a tritone sub."

[[borrowed.major]]
degree = 8
qclasses = ["dom"]
numeral = "♭VI7"
source = "parallel minor (Aeolian) + b7"
quality_required = false
note = "[UNCERTAIN] bVI7 is common in J-pop; resolving to V it is subV/V (tritone rule wins)."

# ---- minor keys (borrowing from the parallel major / Dorian) ----
[[borrowed.minor]]
degree = 0
qclasses = ["maj"]
numeral = "I"
source = "parallel major (Picardy third)"
quality_required = true
note = "Major tonic in a minor key."

[[borrowed.minor]]
degree = 5
qclasses = ["maj", "dom"]
numeral = "IV"
source = "Dorian / melodic minor"
quality_required = true
note = "IV / IV7 in minor: the raised 6th (F# in A minor) is the borrowed tone."

[[borrowed.minor]]
degree = 2
qclasses = ["min"]
numeral = "ii"
source = "Dorian / parallel major"
quality_required = true
note = "ii / iim7 in minor: the raised 6th is the chord's fifth."

[[borrowed.minor]]
degree = 1
qclasses = ["maj"]
numeral = "♭II"
source = "Phrygian (Neapolitan)"
quality_required = false
note = "Neapolitan bII."

# ---------------------------------------------------------------------------------------
[named_progressions]
# Conventionally named progressions, matched in any transposition. degrees / qclasses are
# relative to the REFERENCE MAJOR KEY in which the progression is named. Matches are listed in
# AnalysisResult.progressions (they are labels, not chromatic "events").
enabled = true
key_prior = 1.5     # HMM log-bonus per matched segment for the reference key (use_key_prior only)
min_position_factor = 0.3   # every chord of a match needs at least this much evidence (2026-10-07);
                            # match confidence = geometric mean over positions

[[named_progressions.idiom]]
name = "丸サ進行"
alias = "Just the Two of Us progression"
degrees = [5, 4, 9, 7, 0]
qclasses = [["maj"], ["dom", "maj"], ["min"], ["min"], ["dom", "maj"]]
# User decision 2026-10-06: analyse this loop in the conventional reference (IVmaj7 = first
# chord), not in the key its internal ii–V–I points to (would be Imaj7–VII7–iii–ii–V7).
use_key_prior = true
note = "IVmaj7–III7–vim7–vm7–I7. [UNCERTAIN] Some sources call only IVmaj7–III7–vim7 the 'JTTOU' core."

[[named_progressions.idiom]]
name = "王道進行"
alias = "Royal Road"
degrees = [5, 7, 4, 9]
qclasses = [["maj"], ["maj", "dom"], ["min", "dom"], ["min"]]
# User decision 2026-10-06: bare loops keep the major prior + ambiguity flag, no extra prior.
use_key_prior = false
note = "IVmaj7–V7–iiim7–vim7; the III7 variant (iii replaced by V7/vi) is included."

[[named_progressions.idiom]]
name = "小室進行"
alias = "Komuro progression"
degrees = [9, 5, 7, 0]
qclasses = [["min"], ["maj"], ["maj", "dom"], ["maj"]]
use_key_prior = false
note = "vi–IV–V–I."

# カノン進行 (user 2026-10-07: was never found in real songs — the strict 8-chord form is rare).
# Two entries, same name (overlaps are merged, the longer / more confident match is kept):
[[named_progressions.idiom]]
name = "カノン進行"
alias = "Canon progression"
degrees = [0, 7, 9, 4, 5, [0, 4], [5, 2], 7]
qclasses = [["maj"], ["maj", "dom"], ["min"], ["min"], ["maj"], ["maj", "min"], ["maj", "min"], ["maj", "dom", "sus"]]
min_length = 5
use_key_prior = false
note = """I–V–vi–iii–IV–I–IV–V (Pachelbel). I–V–vi–iii–IV is the distinctive core; common J-pop second
halves (IV–iii–ii–V, IV–I/3–ii–V) are accepted. I–V–vi–IV (axis progression) is NOT canon."""

[[named_progressions.idiom]]
name = "カノン進行"
alias = "Canon progression (descending bass)"
# The Pachelbel bass line 1–7–6–5–4: I – V/7 – vi – (I/5 | iii/5 | V) – (IV | II/♯4 | ♯ivø7).
# Roots are loose because J-pop reharmonises the line; the stepwise bass is the evidence.
# Full line 1–7–6–5–4–3–(2|4)–5: … – IV – (I/3 | iii) – (ii | IV) – V; first 5 = core.
degrees = [0, 7, 9, [0, 4, 7], [5, 2, 6], [0, 4], [2, 5], 7]
qclasses = "any"
bass = [0, 11, 9, 7, [5, 6], 4, -1, -1]
min_length = 5
use_key_prior = false
note = "[UNCERTAIN] whether the chromatic ♯4 bass (II/♯4, ♯ivø7) still counts as カノン進行 or a derivative."

[deceptive_cadence]
enabled = true
# User 2026-10-07: too many reports on J-pop (nearly all were IV–V–vi) -> graded preparation.
prepared = 1.0              # V (or V7) preceded by ii: cadential ii–V
prepared_iv_seventh = 0.8   # IV → V7 → vi
prepared_iv_triad = 0.5     # IV → V → vi: stock J-pop motion; usually dropped or flagged low-confidence
seventh_only = 0.8          # V7 without predominant preparation; bare unprepared V→vi is not reported

# =======================================================================================
# Recognition layer (Phase 3, option A — see docs/phase3_options.md)
[frontend]
top_k = 5
min_candidate_prob = 0.02

[frontend.beats]
backend = "beat_this"                     # beat_this | librosa
checkpoint = "models/beat_this/final0.ckpt"
device = "cpu"

[frontend.chords]
backend = "lv_chordia"
vocabulary = "submission"                 # submission (301 chords) | ismir2017 | full

[frontend.decode]
obs_weight = 1.5          # temperature on beat-mean frame log-likelihood. 1.0 -> 1.5 calibrated on IdolSongsJp dev 2026-10-07
change_penalty = 1.0      # log-cost of a chord change between beats (on top of the prior). 2.0 -> 1.0 (dev)
no_chord_change = -1.0    # extra cost for changes into / out of N
change_extra_halfbar = 0.5   # extra cost of a change on the half-bar beat (bar line: 0)
change_extra_offbeat = 0.5   # extra cost of a change on any other beat. 1.5 -> 0.5 (dev)
transition_prior = ""     # optional JSON from harmonia.frontend.transition_prior (ChoCo stats)
seventh_bias = 1.0        # log-bonus for vocabulary chords with a 7th (class-prior correction). 0 -> 1.0 (dev)

[ui]
library = ["data/external/user_music"]   # default song library for `harmonia ui` (dirs or files, relative to repo)
